<p class="hint-container-title">问题</p>
<p>有 <span v-pre class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>13</mn></mrow><annotation encoding="application/x-tex">13</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">13</span></span></span></span> 个外观完全相同的球，其中恰有一个球重量异常。异常球可能偏重，也可能偏轻，但事先不知道是哪一种。</p>
<p>只有一架没有砝码的天平。每次称量可以把若干球放在左盘、若干球放在右盘，天平只会给出三种结果：左重、右重、平衡。</p>
<p>问：能否只称量 <span v-pre class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>3</mn></mrow><annotation encoding="application/x-tex">3</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">3</span></span></span></span> 次，就把异常球找出来？</p>
</div>
