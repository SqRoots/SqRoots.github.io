<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">天使问题示意图</title>
  <desc id="desc">无限棋盘的一小块，恶魔已经放置若干路障，力量为二的天使可以飞到切比雪夫距离不超过二的无路障格子。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d7dde7" stroke-width="1"/>
    </pattern>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#172033" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="720" height="420" fill="#f7f9fc"/>
  <rect x="60" y="40" width="600" height="320" rx="8" fill="#fff" filter="url(#soft-shadow)"/>
  <rect x="80" y="60" width="560" height="280" fill="url(#grid)"/>

  <g fill="#eef7ff" stroke="#72a7d8" stroke-width="2">
    <rect x="240" y="140" width="40" height="40"/>
    <rect x="280" y="140" width="40" height="40"/>
    <rect x="320" y="140" width="40" height="40"/>
    <rect x="360" y="140" width="40" height="40"/>
    <rect x="400" y="140" width="40" height="40"/>
    <rect x="240" y="180" width="40" height="40"/>
    <rect x="280" y="180" width="40" height="40"/>
    <rect x="320" y="180" width="40" height="40"/>
    <rect x="360" y="180" width="40" height="40"/>
    <rect x="400" y="180" width="40" height="40"/>
    <rect x="240" y="220" width="40" height="40"/>
    <rect x="280" y="220" width="40" height="40"/>
    <rect x="360" y="220" width="40" height="40"/>
    <rect x="400" y="220" width="40" height="40"/>
    <rect x="240" y="260" width="40" height="40"/>
    <rect x="280" y="260" width="40" height="40"/>
    <rect x="320" y="260" width="40" height="40"/>
    <rect x="360" y="260" width="40" height="40"/>
    <rect x="400" y="260" width="40" height="40"/>
    <rect x="240" y="300" width="40" height="40"/>
    <rect x="280" y="300" width="40" height="40"/>
    <rect x="320" y="300" width="40" height="40"/>
    <rect x="360" y="300" width="40" height="40"/>
    <rect x="400" y="300" width="40" height="40"/>
  </g>

  <g fill="#2f3542">
    <rect x="280" y="100" width="40" height="40"/>
    <rect x="320" y="100" width="40" height="40"/>
    <rect x="360" y="100" width="40" height="40"/>
    <rect x="400" y="100" width="40" height="40"/>
    <rect x="440" y="100" width="40" height="40"/>
    <rect x="480" y="100" width="40" height="40"/>
    <rect x="480" y="140" width="40" height="40"/>
    <rect x="480" y="180" width="40" height="40"/>
    <rect x="480" y="220" width="40" height="40"/>
    <rect x="480" y="260" width="40" height="40"/>
    <rect x="200" y="260" width="40" height="40"/>
    <rect x="200" y="300" width="40" height="40"/>
    <rect x="240" y="100" width="40" height="40"/>
  </g>

  <g fill="none" stroke="#4c8ed9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 360 240 C 382 214 408 206 440 200"/>
    <path d="M 430 190 L 440 200 L 427 207"/>
  </g>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#1f2937">
    <rect x="92" y="72" width="258" height="116" rx="8" fill="#ffffff" fill-opacity="0.92" stroke="#cfd8e6"/>
    <text x="112" y="103" font-size="18" font-weight="700">无限棋盘的一小块</text>
    <text x="112" y="131" font-size="14">黑格：恶魔放置的路障</text>
    <text x="112" y="154" font-size="14">蓝格：力量 2 的可达范围</text>
    <text x="112" y="177" font-size="14">目标：永远找到无路障格子</text>
    <rect x="430" y="68" width="132" height="28" rx="6" fill="#ffffff" stroke="#cfd8e6"/>
    <text x="496" y="87" font-size="14" text-anchor="middle">恶魔正在修“墙”</text>
    <rect x="274" y="370" width="132" height="28" rx="6" fill="#ffffff" stroke="#cfd8e6"/>
    <text x="340" y="389" font-size="14" text-anchor="middle">天使当前位置</text>
  </g>

  <path d="M 340 370 L 340 257" fill="none" stroke="#c9a226" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.45"/>
  <path d="M 326 265 L 340 235 L 354 265 Z" fill="#f8df7a" fill-opacity="0.86" stroke="#c9a226" stroke-width="2"/>
</svg>
